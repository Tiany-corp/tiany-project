<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Horizontal Bar Gradient (Turquoise to Blue) -->
    <linearGradient id="horizGrad" x1="110" y1="150" x2="402" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d1ff" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>
    <!-- Vertical Bar Gradient (Purple to Pink) -->
    <linearGradient id="vertGrad" x1="256" y1="200" x2="256" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b26aff" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <!-- Ambient Glow Filter -->
    <filter id="ambientGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Glowing background elements for the premium neon effect -->
  <g filter="url(#ambientGlow)" opacity="0.55">
    <path d="M 110 180 L 140 120 L 372 120 L 402 180 Z" fill="url(#horizGrad)" />
    <path d="M 226 200 L 286 200 L 286 400 L 256 430 L 226 400 Z" fill="url(#vertGrad)" />
  </g>

  <!-- Crisp foreground elements -->
  <!-- Horizontal Bar of the "T" -->
  <path d="M 110 180 L 140 120 L 372 120 L 402 180 Z" fill="url(#horizGrad)" />
  
  <!-- Vertical Column of the "T" (overlaps slightly, creating a beautiful layered 3D look) -->
  <path d="M 226 195 L 286 195 L 286 400 L 256 430 L 226 400 Z" fill="url(#vertGrad)" />
</svg>
